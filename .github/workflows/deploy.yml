name: Deploy to Alwaysdata
on:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Recuperation du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Installation de Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "**/package-lock.json"

      # --- PHASES DE BUILD ---
      - name: 3. Build Astro
        working-directory: S1-UE52-HTML-CSS-JS/TutoHTMLMedia
        run: |
          npm ci
          npm run build

      - name: 4. Build React (Phase 2)
        working-directory: S2-UE61-PHP-DB/TP_UE_6_3_1/Phase_2
        run: |
          npm ci
          npm run build

      # --- PHASES DE DEPLOIEMENT (Plus robustes) ---

      - name: 5. Deploiement Portfolio (Racine)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "./"
          REMOTE_HOST: "ssh-boyer-laurent.alwaysdata.net"
          REMOTE_USER: "boyer-laurent"
          TARGET: "/home/boyer-laurent/www/"
          EXCLUDE: "/S1-UE52-HTML-CSS-JS/TutoHTMLMedia/, /S2-UE61-PHP-DB/TP_UE_6_3_1/Phase_2/, .git*, .github/, node_modules/"

      - name: 6. Deploiement Build Astro
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "S1-UE52-HTML-CSS-JS/TutoHTMLMedia/dist/"
          REMOTE_HOST: "ssh-boyer-laurent.alwaysdata.net"
          REMOTE_USER: "boyer-laurent"
          TARGET: "/home/boyer-laurent/www/S1-UE52-HTML-CSS-JS/TutoHTMLMedia/"

      - name: 7. Deploiement Build React (Phase 2)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "S2-UE61-PHP-DB/TP_UE_6_3_1/Phase_2/dist/"
          REMOTE_HOST: "ssh-boyer-laurent.alwaysdata.net"
          REMOTE_USER: "boyer-laurent"
          TARGET: "/home/boyer-laurent/www/S2-UE61-PHP-DB/TP_UE_6_3_1/Phase_2/"