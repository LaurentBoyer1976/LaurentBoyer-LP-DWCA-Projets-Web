name: Deploy to Alwaysdata
on:
  push:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Recuperation du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Aide a resoudre l'erreur 128

      - name: 2. Installation de Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: "**/package-lock.json"

      # --- PHASES DE BUILD ---
      - name: 3. Build Astro
        working-directory: S1-UE52-HTML-CSS-JS/TutoHTMLMedia
        run: |
          npm ci
          npm run build

      - name: 4. Build React (Phase 2)
        working-directory: S2-UE61-PHP-DB/TP_UE_6_3_1/Phase_2
        run: |
          npm ci
          npm run build

      # --- PHASES DE DEPLOIEMENT (Rsync) ---

      - name: 5. Deploiement Portfolio (Racine)
        uses: Burnett01/rsync-deployments@7.0.0
        with:
          switches: >-
            -avzr --delete
            --exclude='/S1-UE52-HTML-CSS-JS/TutoHTMLMedia/'
            --exclude='/S2-UE61-PHP-DB/'
            --exclude='.git*'
            --exclude='.github/'
            --exclude='node_modules/'
          path: ./
          remote_path: /home/boyer-laurent/www/
          remote_host: ssh-boyer-laurent.alwaysdata.net
          remote_user: boyer-laurent
          remote_key: ${{ secrets.ALWAYSDATA_SSH_KEY }}

      - name: 6. Deploiement Build Astro
        uses: Burnett01/rsync-deployments@7.0.0
        with:
          switches: -avzr --delete
          path: S1-UE52-HTML-CSS-JS/TutoHTMLMedia/dist/
          remote_path: /home/boyer-laurent/www/S1-UE52-HTML-CSS-JS/TutoHTMLMedia/
          remote_host: ssh-boyer-laurent.alwaysdata.net
          remote_user: boyer-laurent
          remote_key: ${{ secrets.ALWAYSDATA_SSH_KEY }}

      - name: 7. Deploiement Build React (Phase 2)
        uses: Burnett01/rsync-deployments@7.0.0
        with:
          switches: -avzr --delete
          path: S2-UE61-PHP-DB/TP_UE_6_3_1/Phase_2/dist/
          remote_path: /home/boyer-laurent/www/S2-UE61-PHP-DB/TP_UE_6_3_1/Phase_2/
          remote_host: ssh-boyer-laurent.alwaysdata.net
          remote_user: boyer-laurent
          remote_key: ${{ secrets.ALWAYSDATA_SSH_KEY }}